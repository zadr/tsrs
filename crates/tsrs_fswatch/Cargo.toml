[package]
name = "tsrs_fswatch"
version = "7.1.0-beta.tsrs2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
readme.workspace = true
include = ["/src", "/build.rs", "/LICENSE", "/NOTICE"]
description = "Filesystem watching for the tsrs TypeScript compiler"

[lints]
workspace = true

[dependencies]
rustc-hash.workspace = true
tsrs_core.workspace = true
# kqueue / inotify / pipe / pathconf / stat bindings (Go: golang.org/x/sys/unix).
libc.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
# kqueue.rs: the entries under each watched directory, hashed by name.
hashbrown.workspace = true

[lib]
test = false
doctest = false
